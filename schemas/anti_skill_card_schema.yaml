version: 1
description: Phase 3 anti-skill card schema

fields:
  - name: card_id
    required: true
    type: string
    description: Stable unique ID for one anti-skill card
  - name: title
    required: true
    type: string
    description: Human-readable anti-skill title
  - name: status
    required: true
    type: string
    allowed: [candidate, validated, active, deprecated]
    description: Lifecycle status of the anti-skill card
  - name: layer
    required: true
    type: string
    allowed: [general, content_type, style_family, author_signature, cross_layer]
    description: Layer where the failure pattern is most relevant
  - name: priority
    required: true
    type: integer
    description: Relative prevention priority
  - name: hardness
    required: true
    type: string
    allowed: [required, preferred, optional]
    description: Whether the prevention rule is mandatory
  - name: content_types
    required: false
    type: string_list
    description: Relevant content-type routing tags
  - name: formats
    required: false
    type: string_list
    description: Relevant format routing tags
  - name: domains
    required: false
    type: string_list
    description: Relevant domain routing tags
  - name: goals
    required: false
    type: string_list
    description: Relevant goal routing tags
  - name: failure_pattern
    required: true
    type: string
    description: The failure behavior to detect and prevent
  - name: detection_signals
    required: true
    type: string_list
    description: Concrete cues that indicate the anti-pattern is present
  - name: likely_causes
    required: false
    type: string_list
    description: Common reasons the anti-pattern appears
  - name: prevention_actions
    required: true
    type: string_list
    description: Corrective or preventive actions
  - name: bad_examples
    required: true
    type: string_list
    description: Negative examples or references
  - name: repair_examples
    required: false
    type: string_list
    description: Improved alternatives that fix the failure pattern
  - name: evaluation_checks
    required: true
    type: string_list
    description: Checks used to verify the anti-pattern has been avoided
  - name: evidence_refs
    required: true
    type: string_list
    description: IDs of supporting evidence records
  - name: notes
    required: false
    type: string
    description: Human-readable caveats or commentary

row_invariants:
  - rule: card_id must be unique within the anti-skill catalog
  - rule: active anti-skill cards must include at least one detection signal and one prevention action
  - rule: active anti-skill cards must include at least one evidence_ref
