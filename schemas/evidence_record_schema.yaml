version: 1
description: Phase 2 evidence record schema

fields:
  - name: evidence_id
    required: true
    type: string
    description: Stable unique identifier for one evidence record
  - name: evidence_kind
    required: true
    type: string
    allowed:
      [
        row_label,
        aggregate_result,
        contrast_finding,
        author_foundation_pattern,
        route_foundation_pattern,
        differential_gain_pattern,
        negative_pattern,
        cross_author_transfer_pattern,
        rejected_pattern,
      ]
    description: Evidence record category
  - name: evidence_origin
    required: false
    type: string
    allowed: [foundation, differential, route, transfer, rejected]
    description: How the evidence was produced
  - name: evidence_polarity
    required: false
    type: string
    allowed: [positive, negative, mixed]
    description: Whether the evidence points toward a positive, negative, or mixed conclusion
  - name: transfer_scope
    required: false
    type: string
    allowed: [author_local, route_local, cross_author]
    description: How far the current evidence is expected to travel
  - name: work_id
    required: false
    type: string
    description: Source work ID when the record points to one row
  - name: author
    required: false
    type: string
    description: Author scope when applicable
  - name: scope
    required: true
    type: string
    allowed: [single_row, same_author, cross_author, same_content_type, same_format, same_domain, mixed]
    description: Comparison or observation scope
  - name: layer
    required: true
    type: string
    allowed: [general, content_type, style_family, author_signature, cross_layer]
    description: Layer the evidence most directly informs
  - name: content_type
    required: false
    type: string
    description: Primary content type tag when present
  - name: format
    required: false
    type: string
    description: Primary format tag when present
  - name: domain
    required: false
    type: string
    description: Primary domain tag when present
  - name: primary_goal
    required: false
    type: string
    description: Primary goal tag when present
  - name: style_family
    required: false
    type: string
    description: Primary style-family tag when present
  - name: author_signature
    required: false
    type: string
    description: Signature tag when the evidence is author-local
  - name: feature_name
    required: true
    type: string
    description: The pattern or feature being discussed
  - name: feature_value
    required: false
    type: string
    description: Concrete observed value of the feature
  - name: metric_name
    required: false
    type: string
    description: Metric used to support the evidence
  - name: metric_value
    required: false
    type: number
    description: Numeric metric value when one exists
  - name: support_count
    required: true
    type: integer
    description: Number of supporting observations or grouped records
  - name: contradiction_count
    required: true
    type: integer
    description: Number of contradicting observations or grouped records
  - name: support_prevalence
    required: false
    type: number
    description: Prevalence of the feature in the supporting group
  - name: contrast_prevalence
    required: false
    type: number
    description: Prevalence of the feature in the contrasted group
  - name: baseline_prevalence
    required: false
    type: number
    description: Prevalence of the feature in the matched baseline scope
  - name: support_sample_size
    required: false
    type: integer
    description: Size of the supporting group
  - name: contrast_sample_size
    required: false
    type: integer
    description: Size of the contrasted group
  - name: baseline_sample_size
    required: false
    type: integer
    description: Size of the matched baseline group
  - name: route_content_type
    required: false
    type: string
    description: Route content-type scope when applicable
  - name: route_format
    required: false
    type: string
    description: Route format scope when applicable
  - name: route_goal
    required: false
    type: string
    description: Route goal scope when applicable
  - name: confidence_grade
    required: true
    type: string
    allowed: [E0, E1, E2, E3, E4]
    description: Strength grade of the evidence
  - name: ready_for_distillation
    required: true
    type: string
    allowed: ["yes", "no"]
    description: Whether the record is eligible for Phase 3 review
  - name: source_excerpt
    required: false
    type: string
    description: Short excerpt or note anchoring the observation
  - name: evidence_refs
    required: false
    type: string_list
    description: IDs of supporting upstream records
  - name: notes
    required: false
    type: string
    description: Human-readable context or caveat

row_invariants:
  - rule: evidence_id must be unique within one evidence export
  - rule: foundation, differential, negative, and rejected evidence require support_count greater than zero
  - rule: ready_for_distillation may only be yes when confidence_grade is E2 or stronger
  - rule: contradiction_count must be zero or positive

